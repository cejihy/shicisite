  }
  #di{

  }
  #viewport.drag{cursor:grabbing}
  #world{position:absolute;left:0;top:0;width:100%;will-change:transform}
  svg{display:block}
  .sway{
    animation-name:sway; animation-timing-function:ease-in-out; animation-iteration-count:infinite;
    transform-box:view-box;will-change:transform;
  }
  /* 拖着走的时候，牌子先别摆——省给滚动 */
  body.moving .sway{animation-play-state:paused}
  body.moving .slip{animation-play-state:paused}
  @keyframes sway{
    0%   {transform:rotate(-1.5deg)}
    50%  {transform:rotate(1.5deg)}
    100% {transform:rotate(-1.5deg)}
  }
  @media (prefers-reduced-motion: reduce){
    .sway{animation:none}
  }

  /* ---------- 诗墙 ---------- */
  #gallery{
    position:fixed;inset:0;display:none;z-index:14;overflow:hidden;
    background:rgba(238,227,201,.97);
  }
  #gallery.on{display:block}
  #gallery::after{
    content:"";position:fixed;inset:0;pointer-events:none;

  }

    position:absolute;top:88px;left:6%;right:6%;height:7px;border-radius:4px;
    background:linear-gradient(180deg,#7a6448,#43352a 60%,#2c221a);
    box-shadow:0 2px 5px rgba(60,42,22,.35);
  }
  #slips{
    position:absolute;top:88px;left:0;right:0;bottom:0;
    overflow-x:auto;overflow-y:hidden;
    scrollbar-width:thin;
  }
  #slips-inner{
    display:flex;align-items:flex-start;gap:44px;
    width:max-content;margin:0 auto;padding:0 8%;
    min-height:100%;
  }
  .slip{
    flex:0 0 auto;width:64px;display:flex;flex-direction:column;align-items:center;
    transform-origin:top center;
    animation:sway 7.2s ease-in-out infinite;
    padding-top:0;cursor:pointer;
  }
  .slip .str{width:1px;height:36px;background:rgba(46,40,32,.5)}
  .slip .sheet2{
    width:64px;height:280px;background:rgba(250,243,226,.96);
    border:1px solid rgba(96,70,38,.45);border-radius:2px;
    box-shadow:0 3px 7px rgba(70,50,26,.14);
    writing-mode:vertical-rl;
    display:flex;flex-direction:column;align-items:flex-start;
    gap:12px;padding:16px 10px;
  }
  .slip .t{font-size:17px;letter-spacing:.26em;color:#2e2822}
  .slip .l{font-size:12px;letter-spacing:.18em;color:#6b5c44}
  .slip .d{font-size:10px;letter-spacing:.12em;color:#8f7f63}
  .slip:hover .sheet2{border-color:rgba(60,44,24,.75);background:rgba(253,247,232,1)}
  .slip.blank{cursor:default;opacity:.45}
  .slip.blank .sheet2{border-style:dashed;background:rgba(246,238,220,.5);box-shadow:none}
  .slip.blank .t{font-size:13px;color:#8f7f63;letter-spacing:.3em}
  #gal-back{
    position:fixed;top:18px;left:22px;font-size:12px;color:#7d715c;letter-spacing:.2em;z-index:16;opacity:.6;cursor:pointer;
  }
  #gal-back:hover{opacity:1}

  #top{

    display:flex;align-items:center;justify-content:flex-end;padding:0 26px;

  }
  #hint{position:fixed;bottom:70px;left:0;right:0;text-align:center;font-size:11px;
    letter-spacing:.34em;color:#8a7a5e;transition:opacity 1s ease;z-index:6}

  /* 阅读 */
  #reader{position:fixed;inset:0;display:none;background:#eee2c6;color:var(--ink);cursor:pointer;overflow:hidden;z-index:20}
  #reader.on{display:block}
  #reader::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(130% 100% at 50% 40%, rgba(255,250,235,.55), rgba(0,0,0,0) 62%),
               radial-gradient(140% 120% at 50% 50%, rgba(0,0,0,0) 58%, rgba(84,66,40,.18) 100%)}
  #sheet{position:relative;z-index:2;height:100%;display:flex;align-items:flex-start;justify-content:center;padding:16vh 8vw 8vh;overflow-y:auto;scrollbar-width:none;-ms-overflow-style:none}

  #inner{width:min(640px,100%)}
  #r-head{font-size:12px;letter-spacing:.3em;color:#8a7a5e;margin-bottom:28px;text-align:center;opacity:0;transition:opacity .8s ease}
  #r-head.on{opacity:1}
  #text{font-size:21px;line-height:2.15;letter-spacing:.05em}
  p.para{margin:0;opacity:0;transition:opacity .5s ease}
  p.para.on{opacity:1}
  p.short{font-size:25px;letter-spacing:.14em}
  p.line{font-size:24px;line-height:2.5;letter-spacing:.08em;margin:0 0 .3em;text-align:center}
  #poem{opacity:0;transition:opacity 1s ease;margin-top:.7em}
  #poem.on{opacity:1}
  #tail{margin-top:2.2em;text-align:center;opacity:0;transition:opacity 1.4s ease}
  #tail.on{opacity:1}
  #seal2{display:inline-block;width:40px;height:40px;line-height:40px;color:#f6efe0;background:var(--seal);

  #tail .note{font-size:12px;color:#7d715c;letter-spacing:.14em;line-height:2}
  #hint2{position:fixed;bottom:20px;left:0;right:0;text-align:center;font-size:11px;color:#8a7a5e;letter-spacing:.3em;opacity:0;transition:opacity .6s ease;z-index:22}
  #hint2.on{opacity:.8}
  #back{position:fixed;top:18px;left:22px;font-size:12px;color:#7d715c;letter-spacing:.2em;z-index:24;opacity:.6}
  #back:hover{opacity:1}
</style>

       "秋。塞上。",
       "关城夹在山中间，出城就是沙。白日里跟着队伍巡墙。",
       "夜里起了风，从北边来，到城头上呜呜地绕。",
       "戍卒缩在垛口底下，把皮甲裹紧，朝手上呵气。呵出的白气，一下就散了。",
       "我靠着城砖站定。砖凉，凉意从背上进来。",
       "更鼓敲过两声，云散了，月亮上来。",
       "照着城，照着城外的沙，照到山的那一边。",
       "我在城上站了很久。下城时，得了四句。"
     ],
     poem:["秦时明月汉时关，万里长征人未还。","但使龙城飞将在，不教胡马度阴山。"],
     note:"作年无考　塞上"},
    {n:"李白", b:701, d:762, seal:"太白", year:"乾元二年 759", head:"白帝城下　遇赦",
     paras:[
       "乾元二年，春。白帝城。",
       "我是往夜郎去的。永王那一案，判的长流。走到这里，赦书到了。",
       "长流免了。",
       "文书是县里送来的。念完，交割，人就走了。我在驿站门口站了一会儿，手里捏着那纸文书，纸边捏得发软。",
       "城外就是江。天没亮透，江上笼着雾。",
       "船家来问：水正好，走不走？",
       "走。",
       "解缆，离岸。猿在山里叫，两岸都是，一声接一声。",
       "船下水急。我立在船头，衣裳叫风鼓起来。两岸的山往后退，退得快。",
       "同船的人抱着包袱，缩在舱里，不肯出来。",
       "水声在船底下响，响得耳朵发麻。",
       "雾散了，日头出来，照在江上，晃眼。",
       "猿声还在后头。船已经出去很远了。"
     ],
     poem:["朝辞白帝彩云间，千里江陵一日还。","两岸猿声啼不住，轻舟已过万重山。"],
     note:"乾元二年　流放夜郎　行至白帝城遇赦"},
    {n:"王维", b:701, d:761, seal:"摩诘", year:"年份不详", head:"辋川　秋暝",
     paras:[
       "秋。辋川。",
       "午后下过一场雨，山里空。我在山屋里坐着。",
       "天黑下来，一暗，凉意就进来了。",
       "月亮从东山上来，照进松林。松针上挂着水，一亮一亮。",
       "泉水从石头上过去。白日听不见，夜里静，就听见了。",
       "竹林里忽然一阵响，是浣衣的女人回来了，一路说笑。",
       "水边的莲叶动了一动，有渔舟下来了。",
       "春天的花早谢了。这样的地方，秋天也好住。",
       "我在廊下站了一会儿，回屋写了这首。"
     ],
     poem:["空山新雨后，天气晚来秋。","明月松间照，清泉石上流。","竹喧归浣女，莲动下渔舟。","随意春芳歇，王孙自可留。"],
     note:"作年无考　辋川别业"},
    {n:"杜甫", b:712, d:770, seal:"少陵", year:"上元二年 761", head:"成都草堂　秋雨破屋",
     paras:[
       "上元二年，八月。成都。",
       "风是夜里起来的。先吹得竹叶响，后来不响了，直接掀屋顶。",
       "茅草飞过江去，挂在树梢上，有的落进塘里。我拄着拐追出去，喊了一声，没用。",
       "村里的小孩抱着草跑。我喊他们，他们跑得更快。这年头，大人也抢，何况孩子。",
       "天黑下来，雨跟着来了。",
       "屋里没有一处干的地方。床头是湿的，被子是湿的。我坐着，腿麻了，也不想动。",
       "这几年，从长安到秦州，从秦州到成都，睡过的湿地方不少。有时半夜醒着，想起死掉的人，就再睡不着。",
       "雨脚在漏，一根一根，像麻线。",
       "我想，要是能有千万间大屋——不是给我一个人住，是给天下的寒士，都住进去，风雨不动，安稳如山。",
       "那样的话，我这间草屋漏到塌，也没什么。"
     ],
     poem:["八月秋高风怒号，卷我屋上三重茅。","床头屋漏无干处，雨脚如麻未断绝。",
           "自经丧乱少睡眠，长夜沾湿何由彻！","安得广厦千万间，大庇天下寒士俱欢颜！"],
     note:"上元二年　成都浣花溪　草堂"},
    {n:"刘禹锡", b:772, d:842, seal:"梦得", year:"年份不详", head:"和州　陋室",
     paras:[
       "秋。和州。",
       "官舍在城南，一间小屋。一张几，一张榻，墙皮掉了几块。",
       "雨下了两日。",
       "台阶上生出苔，绿到了门边。院里的草长高了，青色映进帘子。",
       "路过的人朝屋里看了一眼，摇摇头，走了。",
       "我扫地，抹几，把琴摆上。",
       "翻两页经，弹一曲。屋里静。",
       "午后晴了，日头照进来，落在席子上。",
       "这样的屋子，我给它写了一篇铭。"
     ],
     poem:["山不在高，有仙则名。水不在深，有龙则灵。","斯是陋室，惟吾德馨。"],
     note:"作年无考　和州。铭不见于梦得本集，传为和州任上作"},
    {n:"白居易", b:772, d:846, seal:"乐天", year:"元和十一年 816", head:"湓浦口　夜送客",
     paras:[
       "元和十一年，秋。江州。",
       "我是贬来的。去年从长安下来，官降了，人还在，只是说话没人听了。",
       "今晚送客。湓浦口，枫叶和荻花都白了。主人下马，客人上船，酒摆出来，没有音乐。喝了半天，谁也不痛快。",
       "正要走，水上传来琵琶声。",
       "是京城里的调子。",
       "我把船靠过去，添了酒，重新点了灯。喊了几声，那船里的人才出来——抱着琵琶，遮着半张脸。",
       "她弹。一遍一遍，像在说自己。",
       "弹完，她讲：原是长安的歌女，年轻时红过，后来年纪大了，嫁了个商人。商人重利，上个月去浮梁买茶，到现在没回来。她一个人在江口守着空船。",
       "我问她：你也是长安来的？",
       "她说：是。",
       "我说：我也是。",
       "我们谁也没有哭，只是都不说话了。江心那轮月亮，白得发凉。"
     ],
     poem:["浔阳江头夜送客，枫叶荻花秋瑟瑟。","忽闻水上琵琶声，主人忘归客不发。",
           "同是天涯沦落人，相逢何必曾相识。","座中泣下谁最多？江州司马青衫湿。"],
     note:"元和十一年　左迁江州司马　夜送客湓浦口"},
    {n:"杜牧", b:803, d:852, seal:"牧之", year:"年份不详", head:"清明　遇雨",
     paras:[
       "清明。路上。",
       "雨从早上落，细细的，不断。我出门没带伞，衣裳湿了，贴在身上。",
       "路上的人都低着头走。有去上坟的，手里提着纸钱，纸钱叫雨打湿了。",
       "我找了棵树下站住，雨还是往脖子里钻。冷。",
       "想找个地方避一避，喝口热的。",
       "前面有个牧童，骑在牛背上，斗笠压得低。",
       "我问他：哪里有酒家？",
       "他不答，抬手往远处一指。",
       "雨雾里一片杏花，花底下有个村子。我朝那边走。"
     ],
     poem:["清明时节雨纷纷，路上行人欲断魂。","借问酒家何处有，牧童遥指杏花村。"],
     note:"作年无考。此诗不见于樊川集，传为杜牧作；场景依诗面"},
    {n:"温庭筠", b:812, d:870, approx:true, seal:"飞卿", year:"年份不详", head:"长安　闺中晨起",
     paras:[
       "春。长安。",
       "我在城南的歌楼里混得久了。姑娘们唱词，常要我填新的。",
       "昨夜酒散得晚。醒来，日头已经爬上屏风。",
       "屏风上画着小山，一重一重。日光斜过来，画上的金粉一明一暗。",
       "楼上的姑娘起得迟。帘子里头，梳子碰着妆盒，一下，一下。",
       "她在对镜画眉，画了许久。",
       "宿酒未醒，我的头还有些沉。",
       "日头又升高了一竿，照到阶前。",
       "楼下有人喊：词得了么？",
       "我应了一声，提笔。"
     ],
     poem:["小山重叠金明灭，鬓云欲度香腮雪。","懒起画蛾眉，弄妆梳洗迟。"],
     note:"作年无考　长安　应歌之作"},
    {n:"李商隐", b:813, d:858, seal:"义山", year:"年份不详", head:"郑州　抚瑟",
     paras:[
       "秋夜。郑州。",
       "病了几日，今夜好些，披衣坐起来。",
       "屋角有一张瑟，五十根弦。",
       "它没招谁，没惹谁，平白就是五十根弦。",
       "我伸手拨。一弦一柱，慢慢拨过去。",
       "弦声低。一声，又一声。屋里没有别人。",
       "烛芯结了个花，爆了一下。",
       "窗外起了风，吹得窗纸响。",
       "我按着弦，坐了很久。"
     ],
     poem:["锦瑟无端五十弦，一弦一柱思华年。","庄生晓梦迷蝴蝶，望帝春心托杜鹃。","沧海月明珠有泪，蓝田日暖玉生烟。","此情可待成追忆，只是当时已惘然。"],
     note:"作年与本事无考，悼亡、自伤诸说并存，不取。取晚年郑州家居时"},
    {n:"李煜", b:937, d:978, seal:"重光", year:"太平兴国三年 978", head:"汴京　小楼七夕",
     paras:[
       "太平兴国三年，七夕。汴京。",
       "我在小楼上，住了两年多了。",
       "七夕是我的生日。我叫旧日的宫伎上来，作乐。",
       "她们拨起琵琶，还是南边的调子。",
       "酒斟上，满座都不说话。",
       "我唱了新填的词。唱到一半，月亮升上来，照得楼板发白。",
       "墙外的巷子里，有人走过，脚步停了停，又走远。",
       "乐声没有停，一直传到墙外。",
       "酒凉了，没有人添。",
       "那晚填的，就是这个。"
     ],
     poem:["春花秋月何时了，往事知多少。","小楼昨夜又东风，故国不堪回首月明中。","雕栏玉砌应犹在，只是朱颜改。","问君能有几多愁，恰似一江春水向东流。"],
     note:"太平兴国三年　汴京　七夕。是夕命故妓作乐，声闻于外，太宗闻之怒，赐牵机药。见王铚《默记》"},
    {n:"柳永", b:984, d:1053, approx:true, seal:"耆卿", year:"年份不详", head:"汴京郊外　长亭送别",
     paras:[
       "秋。汴京城外。",
       "在京城待不下去了。行李收拾好，船雇好了。",
       "傍晚，长亭。蝉叫得又急又哑。",
       "一阵急雨刚过，停了。",
       "她送我到亭子里。酒摆出来，谁也喝不下。",
       "船家在船上喊：要开船了！",
       "我们拉着手。她眼里有泪，我也有。",
       "说什么呢。什么也说不出来。",
       "天黑了，渡口点起灯笼。",
       "我上了船。船离了岸，亭子往后退，人影小了。",
       "今夜不知行到哪里。"
     ],
     poem:["寒蝉凄切，对长亭晚，骤雨初歇。","执手相看泪眼，竟无语凝噎。","今宵酒醒何处？杨柳岸，晓风残月。"],
     note:"作年无考　离汴京时作"},
    {n:"晏殊", b:991, d:1055, seal:"同叔", year:"年份不详", head:"汴京　园亭春暮",
     paras:[
       "暮春。汴京。",
       "家里的园子不大，亭台是旧的。午后无事，温了一壶酒，在亭子里坐。",
       "叫歌女来，唱新填的词。一曲，一杯。",
       "天气和去年这个时候差不多。亭子还是这个亭子。",
       "日头往西斜了。",
       "花瓣落在石桌上，落进酒杯里，捞也捞不尽。",
       "燕子飞回来，从檐下过去，像是去年住过的那一只。",
       "歌女唱完了，抱着琵琶退下去。",
       "我一个人在园子里走。香径上的落花，踩上去软软的。",
       "走了一圈，又一圈。"
     ],
     poem:["一曲新词酒一杯，去年天气旧亭台。","夕阳西下几时回？","无可奈何花落去，似曾相识燕归来。","小园香径独徘徊。"],
     note:"作年无考　汴京园亭"},
    {n:"欧阳修", b:1007, d:1072, seal:"永叔", year:"年份不详", head:"深院　春恨",
     paras:[
       "暮春。",
       "傍晚起了风，雨跟着来。",
       "我把院门关上。雨打在门板上，一阵紧，一阵。",
       "隔着墙，邻家的秋千架立在雨里，空空的。",
       "风一卷，花瓣飞过墙头，从秋千那边过去了。",
       "我站在廊下看，衣裳叫风打湿了半边。",
       "雨下到夜里才住。",
       "回屋，填了一阕词。托的是一个深闺女子的口。"
     ],
     poem:["庭院深深深几许？杨柳堆烟，帘幕无重数。","雨横风狂三月暮，门掩黄昏，无计留春住。","泪眼问花花不语，乱红飞过秋千去。"],
     note:"作年无考。此词一作冯延巳；李清照以为欧公作，从之"},
    {n:"王安石", b:1021, d:1086, seal:"介甫", year:"熙宁八年 1075", head:"瓜洲渡　望江南",
     paras:[
       "熙宁八年，二月。瓜洲渡。",
       "朝廷召我回京。船过江，天晚了，泊在瓜洲。",
       "京口在南岸，隔着一道水。江宁更远了，隔着几重山。",
       "船家添了油，把灯点上。",
       "我摊开路上写的诗稿。四句，第三句总不顺。",
       "'又到江南岸'——'到'字不好。圈了，改'过'。再读，不好。改'入'，改'满'。改来改去，十几遍。",
       "江风从船篷缝里进来，灯花晃。",
       "风住了。月亮上来，照见南岸的草，绿成一片。",
       "我提笔，写了个'绿'字。"
     ],
     poem:["京口瓜洲一水间，钟山只隔数重山。","春风又绿江南岸，明月何时照我还。"],
     note:"熙宁八年　二月复相赴京　泊瓜洲。系年从通行说；改字事见洪迈《容斋续笔》"},
    {n:"苏轼", b:1037, d:1101, seal:"东坡", year:"元丰五年 1082", head:"沙湖道中　遇雨",
     paras:[
       "元丰五年，三月七日。黄州。",
       "天是灰的，灰里透一点青。出门时没觉得要下雨——这种天色在黄州常见，十天里有八天这样，下不下来，看它高兴。",
       "我们去沙湖。听说那边有块田要卖，价钱公道，靠水。",
       "走到一半，雨就来了。",
       "不是落，是砸。点子打在斗笠上，噼噼啪啪，像有人拿指节在敲。土路一沾水就滑，鞋底开始带泥，走一步，重一分。",
       "伞和蓑衣都留在城里了。",
       "路上一下子散了。挑担的把担子往地上一撂，钻到树底下，竹筐翻了，里头的薯滚进泥水。有人抱着头跑，跑两步滑一跤，爬起来骂一句，再跑。",
       "我们的人也慌了。伴当把外衫脱下来顶在头上，衣裳立刻就透，贴在背上，像多长了一层皮。",
       "我在后面。",
       "竹杖点在泥里，一点一个窝。芒鞋早湿透了，踩下去噗的一声，抬起来又是一声。",
       "雨很大。大到听不见别的。",
       "反倒清静。",
       "三十几岁的人了，被一场雨撵着跑。跑到亭子里，衣裳一样湿；跑到城里，也是湿。既然横竖要湿，跑什么呢。",
       "我就慢下来了。",
       "后来雨小了。云往东边去，山头露出一角。斜阳照下来，照在湿衣裳上，冒起一点白气。",
       "冷。",
       "回头看那段路，萧瑟得很。刚才的雨、滚落的东西、骂人的、跑的、跌倒的，都还搁在那儿，一样不少。",
       "我站了一会儿，把方才那一阵想了一遍。",
       "回去就写了这个。"
     ],
     poem:["莫听穿林打叶声，何妨吟啸且徐行。","竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。",
           "料峭春风吹酒醒，微冷，山头斜照却相迎。","回首向来萧瑟处，归去，也无风雨也无晴。"],
     note:"元丰五年　黄州　沙湖道中遇雨"},
    {n:"黄庭坚", b:1045, d:1105, seal:"鲁直", year:"元丰八年 1085", head:"德州　夜雨怀几复",
     paras:[
       "元丰八年，夜。德州。",
       "我在德平，靠北。黄几复在四会，靠南。隔着几千里。",
       "夜里落雨。我搬了灯，坐到窗前，给他写一首寄去。",
       "雨打在檐上，一滴，一滴。",
       "仆人进来添了回油，灯芯亮了些。",
       "十年了。上一回一起喝酒，是在京城，桃李开花的时候。",
       "窗外雨住了，檐上还在滴水。",
       "我提笔写。写完封好，托明天南去的人带上。"
     ],
     poem:["我居北海君南海，寄雁传书谢不能。","桃李春风一杯酒，江湖夜雨十年灯。"],
     note:"元丰八年　德州德平　寄四会黄几复"},
    {n:"秦观", b:1049, d:1100, seal:"少游", year:"年份不详", head:"小院　七夕",
     paras:[
       "七夕。夜。",
       "我在院子里坐了。院里的葡萄架，叶子叫露水打湿了。",
       "天上有云，薄薄的，织成花样。",
       "银河横过去。牵牛星在东，织女星在西，隔河望着。",
       "邻家的女儿在灯下穿针，穿了几回才进去。",
       "流星落下来。一颗，又一颗。",
       "夜凉了，台阶是湿的。我披了件衣裳。",
       "云散开了些，星子更亮。",
       "我看到夜深，回屋填了这阕。"
     ],
     poem:["纤云弄巧，飞星传恨，银汉迢迢暗度。","金风玉露一相逢，便胜却人间无数。","两情若是久长时，又岂在朝朝暮暮。"],
     note:"作年无考　七夕"},
    {n:"李清照", b:1084, d:1155, approx:true, seal:"易安", year:"年份不详", head:"临安　秋雨黄昏",
     paras:[
       "秋。临安。",
       "明诚走了，有好些年了。带来的金石书画，一路上丢的丢，烧的烧，剩下的不多了。",
       "今天下午，天将暖还冷。我翻箱子找一件厚衣裳，翻了半天。",
       "倒了两杯淡酒。酒薄，挡不住傍晚的风。",
       "雁从天上过，叫了两声。",
       "阶前的菊花开过，落了一地。",
       "我守着窗子坐，天一点一点黑下来。",
       "梧桐叶上落雨。一滴，一滴，到黄昏还在落。",
       "这般光景，我写成了一阕《声声慢》。"
     ],
     poem:["寻寻觅觅，冷冷清清，凄凄惨惨戚戚。","梧桐更兼细雨，到黄昏、点点滴滴。","这次第，怎一个愁字了得！"],
     note:"作年无考　南渡后寓居临安。场景依词面"},
    {n:"陆游", b:1125, d:1210, seal:"务观", year:"嘉定二年 1210", head:"山阴　示儿",
     paras:[
       "嘉定二年，冬。山阴。",
       "我躺了几日，今夜觉得不好。",
       "儿子们都进来了，站在床前。",
       "灯芯太暗，他们把灯挑亮了些。",
       "窗外落雪子，打在瓦上，沙沙地响。",
       "我要笔。",
       "笔拿在手里，沉。",
       "雪住了，屋里静。",
       "我写了四句。写完，笔搁下了。"
     ],
     poem:["死去元知万事空，但悲不见九州同。","王师北定中原日，家祭无忘告乃翁。"],
     note:"嘉定二年十二月　山阴　绝笔"},
    {n:"范成大", b:1126, d:1193, seal:"致能", year:"淳熙十三年 1186", head:"石湖　初夏田家",
     paras:[
       "淳熙十三年，初夏。石湖。",
       "我退居在湖边，早起，沿着湖走。",
       "男人下田锄草，弯腰在稻行里，一行一行过去。",
       "日头高了，田里的人戴起斗笠。",
       "日头偏西，我走到村口。几个小娃娃蹲在桑树阴底下，拿小木棍点瓜种，一棵，一棵。",
       "他们学大人的样子，学得有模有样。",
       "我在树阴里站了一会儿，日头晒在背上。",
       "夜里家家点灯搓麻。麻线在手心里滚，一根接一根。",
       "回来就写了这首。"
     ],
     poem:["昼出耘田夜绩麻，村庄儿女各当家。","童孙未解供耕织，也傍桑阴学种瓜。"],
     note:"淳熙十三年　石湖　四时田园杂兴六十首之一"},
    {n:"杨万里", b:1127, d:1206, seal:"廷秀", year:"年份不详", head:"家园　小池",
     paras:[
       "初夏。家里的园子。",
       "园里有一口小池，泉眼细细的，流水没有声音。",
       "树阴落在水面上。日头正好，水光倒晃着树影。",
       "荷叶才钻出水，尖尖的一小角，还卷着。",
       "一只蜻蜓飞来，立在那一角上，翅膀收着，不动。",
       "我蹲在池边看。",
       "看久了，腿麻，站起来，又看了一回。",
       "云影从池面过了一下，又走了。",
       "回屋写了四句。"
     ],
     poem:["泉眼无声惜细流，树阴照水爱晴柔。","小荷才露尖尖角，早有蜻蜓立上头。"],
     note:"作年无考"},
    {n:"辛弃疾", b:1140, d:1207, seal:"幼安", year:"年份不详", head:"临安　元夕",
     paras:[
       "正月十五。临安。",
       "满城都是灯。我吃过晚饭，出门看灯。",
       "东风一吹，火树银花。烟火放上去，落下来，像星子下雨。",
       "车马过处，香风散一路。箫声、鼓声，闹成一片。鱼龙灯舞到半夜。",
       "仕女满头蛾儿、雪柳，金的玉的，一闪一闪。笑着过去，留下一阵香。",
       "我在人堆里走，人挤人，鞋叫人踩了两回。",
       "走到半夜，人潮退了。灯一处处稀下去。",
       "回去，填了这阕《青玉案》。"
     ],
     poem:["东风夜放花千树，更吹落、星如雨。","蛾儿雪柳黄金缕，笑语盈盈暗香去。","众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。"],
     note:"作年无考　临安元夕"},
    {n:"姜夔", b:1155, d:1221, approx:true, seal:"尧章", year:"淳熙三年 1176", head:"扬州　冬至",
     paras:[
       "淳熙三年，冬至。扬州。",
       "我路过维扬，解鞍歇脚，本想进城慢慢看。",
       "夜里的雪刚停。",
       "进城一看：从前春风十里的地方，一眼望去，全是野麦，青青的。",
       "城里萧条。池苑荒废，老树枝子黑黑的。寒水是碧的。",
       "守城的兵在墙上走，裹紧号衣。",
       "天慢慢暗了。城墙上吹起号角，一声，又一声，在空城里荡。冷。",
       "二十四桥还在。桥下的波心里，荡着一丸冷月。",
       "我在桥边站到天黑透。",
       "这一路的感慨，我自度了一曲。"
     ],
     poem:["淮左名都，竹西佳处，解鞍少驻初程。","过春风十里，尽荠麦青青。","二十四桥仍在，波心荡、冷月无声。","念桥边红药，年年知为谁生。"],
     note:"淳熙三年　至日过维扬　夜雪初霁　自度此曲（小序）"},
    {n:"屈原", b:-340, d:-278, approx:true, seal:"灵均", year:"年份不详", head:"",
     paras:[], poem:["帝高阳之苗裔兮，朕皇考曰伯庸。","摄提贞于孟陬兮，惟庚寅吾以降。","皇览揆余初度兮，肇锡余以嘉名。","纷吾既有此内美兮，又重之以修能。"], note:"节选"},
    {n:"刘邦", b:-256, d:-195, seal:"季", year:"年份不详", head:"",
     paras:[], poem:["大风起兮云飞扬，","威加海内兮归故乡，","安得猛士兮守四方！"], note:""},
    {n:"项羽", b:-232, d:-202, seal:"羽", year:"年份不详", head:"",
     paras:[], poem:["力拔山兮气盖世，","时不利兮骓不逝。","骓不逝兮可奈何，","虞兮虞兮奈若何！"], note:""},
    {n:"曹操", b:155, d:220, seal:"孟德", year:"年份不详", head:"",
     paras:[], poem:["对酒当歌，人生几何！譬如朝露，去日苦多。","慨当以慷，忧思难忘。何以解忧？唯有杜康。","青青子衿，悠悠我心。但为君故，沉吟至今。","呦呦鹿鸣，食野之苹。我有嘉宾，鼓瑟吹笙。","明明如月，何时可掇？忧从中来，不可断绝。","越陌度阡，枉用相存。契阔谈䜩，心念旧恩。","月明星稀，乌鹊南飞。绕树三匝，何枝可依？","山不厌高，海不厌深。周公吐哺，天下归心。"], note:""},
    {n:"曹植", b:192, d:232, seal:"子建", year:"年份不详", head:"",
     paras:[], poem:["煮豆燃豆萁，豆在釜中泣。","本是同根生，相煎何太急。"], note:"事出《世说新语》，从通行四句本"},
    {n:"陶渊明", b:365, d:427, seal:"元亮", year:"年份不详", head:"",
     paras:[], poem:["结庐在人境，而无车马喧。","问君何能尔？心远地自偏。","采菊东篱下，悠然见南山。","山气日夕佳，飞鸟相与还。","此中有真意，欲辨已忘言。"], note:""},
    {n:"谢灵运", b:385, d:433, seal:"康乐", year:"年份不详", head:"",
     paras:[], poem:["殷忧不能寐，苦此夜难颓。","明月照积雪，朔风劲且哀。","运往无淹物，年逝觉已催。"], note:""},
    {n:"鲍照", b:414, d:466, approx:true, seal:"明远", year:"年份不详", head:"",
     paras:[], poem:["泻水置平地，各自东西南北流。","人生亦有命，安能行叹复坐愁！","酌酒以自宽，举杯断绝歌路难。","心非木石岂无感？吞声踯躅不敢言。"], note:""},
    {n:"庾信", b:513, d:581, seal:"子山", year:"年份不详", head:"",
     paras:[], poem:["阳关万里道，不见一人归。","唯有河边雁，秋来南向飞。"], note:""},
    {n:"薛道衡", b:540, d:609, seal:"玄卿", year:"年份不详", head:"",
     paras:[], poem:["入春才七日，离家已二年。","人归落雁后，思发在花前。"], note:""},
    {n:"卢照邻", b:634, d:684, approx:true, seal:"升之", year:"年份不详", head:"",
     paras:[], poem:["浮香绕曲岸，圆影覆华池。","常恐秋风早，飘零君不知。"], note:""},
    {n:"骆宾王", b:640, d:684, approx:true, seal:"观光", year:"年份不详", head:"",
     paras:[], poem:["西陆蝉声唱，南冠客思侵。","那堪玄鬓影，来对白头吟。","露重飞难进，风多响易沉。","无人信高洁，谁为表予心。"], note:""},
    {n:"王勃", b:650, d:676, seal:"子安", year:"年份不详", head:"",
     paras:[], poem:["城阙辅三秦，风烟望五津。","与君离别意，同是宦游人。","海内存知己，天涯若比邻。","无为在歧路，儿女共沾巾。"], note:""},
    {n:"杨炯", b:650, d:693, approx:true, seal:"盈川", year:"年份不详", head:"",
     paras:[], poem:["烽火照西京，心中自不平。","牙璋辞凤阙，铁骑绕龙城。","雪暗凋旗画，风多杂鼓声。","宁为百夫长，胜作一书生。"], note:""},
    {n:"贺知章", b:659, d:744, seal:"季真", year:"年份不详", head:"",
     paras:[], poem:["少小离家老大回，乡音无改鬓毛衰。","儿童相见不相识，笑问客从何处来。"], note:""},
    {n:"张若虚", b:660, d:720, approx:true, seal:"春江", year:"年份不详", head:"",
     paras:[], poem:["春江潮水连海平，海上明月共潮生。","滟滟随波千万里，何处春江无月明。","江流宛转绕芳甸，月照花林皆似霰。","空里流霜不觉飞，汀上白沙看不见。","江天一色无纤尘，皎皎空中孤月轮。","江畔何人初见月？江月何年初照人。","人生代代无穷已，江月年年望相似。","不知江月待何人，但见长江送流水。","白云一片去悠悠，青枫浦上不胜愁。","谁家今夜扁舟子？何处相思明月楼。","可怜楼上月徘徊，应照离人妆镜台。","玉户帘中卷不去，捣衣砧上拂还来。","此时相望不相闻，愿逐月华流照君。","鸿雁长飞光不度，鱼龙潜跃水成文。","昨夜闲潭梦落花，可怜春半不还家。","江水流春去欲尽，江潭落月复西斜。","斜月沉沉藏海雾，碣石潇湘无限路。","不知乘月几人归，落月摇情满江树。"], note:""},
    {n:"陈子昂", b:661, d:702, seal:"伯玉", year:"年份不详", head:"",
     paras:[], poem:["前不见古人，后不见来者。","念天地之悠悠，独怆然而涕下。"], note:""},
    {n:"王翰", b:687, d:726, seal:"子羽", year:"年份不详", head:"",
     paras:[], poem:["葡萄美酒夜光杯，欲饮琵琶马上催。","醉卧沙场君莫笑，古来征战几人回。"], note:""},
    {n:"王之涣", b:688, d:742, seal:"季凌", year:"年份不详", head:"",
     paras:[], poem:["白日依山尽，黄河入海流。","欲穷千里目，更上一层楼。"], note:""},
    {n:"王湾", b:693, d:751, approx:true, seal:"洛阳", year:"年份不详", head:"",
     paras:[], poem:["客路青山外，行舟绿水前。","潮平两岸阔，风正一帆悬。","海日生残夜，江春入旧年。","乡书何处达？归雁洛阳边。"], note:""},
    {n:"崔颢", b:704, d:754, approx:true, seal:"黄鹤", year:"年份不详", head:"",
     paras:[], poem:["昔人已乘黄鹤去，此地空余黄鹤楼。","黄鹤一去不复返，白云千载空悠悠。","晴川历历汉阳树，芳草萋萋鹦鹉洲。","日暮乡关何处是？烟波江上使人愁。"], note:""},
    {n:"高适", b:704, d:765, seal:"达夫", year:"年份不详", head:"",
     paras:[], poem:["千里黄云白日曛，北风吹雁雪纷纷。","莫愁前路无知己，天下谁人不识君。"], note:""},
    {n:"常建", b:708, d:765, approx:true, seal:"通幽", year:"年份不详", head:"",
     paras:[], poem:["清晨入古寺，初日照高林。","曲径通幽处，禅房花木深。","山光悦鸟性，潭影空人心。","万籁此俱寂，但余钟磬音。"], note:""},
    {n:"岑参", b:715, d:770, approx:true, seal:"嘉州", year:"年份不详", head:"",
     paras:[], poem:["北风卷地白草折，胡天八月即飞雪。","忽如一夜春风来，千树万树梨花开。","散入珠帘湿罗幕，狐裘不暖锦衾薄。","将军角弓不得控，都护铁衣冷难着。","瀚海阑干百丈冰，愁云惨淡万里凝。","中军置酒饮归客，胡琴琵琶与羌笛。","纷纷暮雪下辕门，风掣红旗冻不翻。","轮台东门送君去，去时雪满天山路。","山回路转不见君，雪上空留马行处。"], note:""},
    {n:"刘长卿", b:726, d:789, approx:true, seal:"文房", year:"年份不详", head:"",
     paras:[], poem:["日暮苍山远，天寒白屋贫。","柴门闻犬吠，风雪夜归人。"], note:""},
    {n:"韦应物", b:737, d:792, approx:true, seal:"苏州", year:"年份不详", head:"",
     paras:[], poem:["独怜幽草涧边生，上有黄鹂深树鸣。","春潮带雨晚来急，野渡无人舟自横。"], note:""},
    {n:"孟郊", b:751, d:814, seal:"东野", year:"年份不详", head:"",
     paras:[], poem:["慈母手中线，游子身上衣。","临行密密缝，意恐迟迟归。","谁言寸草心，报得三春晖。"], note:""},
    {n:"张籍", b:767, d:830, approx:true, seal:"文昌", year:"年份不详", head:"",
     paras:[], poem:["洛阳城里见秋风，欲作家书意万重。","复恐匆匆说不尽，行人临发又开封。"], note:""},
    {n:"韩愈", b:768, d:824, seal:"退之", year:"元和十四年 819", head:"",
     paras:[], poem:["一封朝奏九重天，夕贬潮州路八千。","欲为圣明除弊事，肯将衰朽惜残年！","云横秦岭家何在？雪拥蓝关马不前。","知汝远来应有意，好收吾骨瘴江边。"], note:"谏佛骨贬潮州，行至蓝关"},
    {n:"柳宗元", b:773, d:819, seal:"子厚", year:"年份不详", head:"",
     paras:[], poem:["千山鸟飞绝，万径人踪灭。","孤舟蓑笠翁，独钓寒江雪。"], note:""},
    {n:"元稹", b:779, d:831, seal:"微之", year:"年份不详", head:"",
     paras:[], poem:["曾经沧海难为水，除却巫山不是云。","取次花丛懒回顾，半缘修道半缘君。"], note:""},
    {n:"贾岛", b:779, d:843, seal:"阆仙", year:"年份不详", head:"",
     paras:[], poem:["松下问童子，言师采药去。","只在此山中，云深不知处。"], note:""},
    {n:"李贺", b:790, d:816, seal:"长吉", year:"年份不详", head:"",
     paras:[], poem:["黑云压城城欲摧，甲光向日金鳞开。","角声满天秋色里，塞上燕脂凝夜紫。","半卷红旗临易水，霜重鼓寒声不起。","报君黄金台上意，提携玉龙为君死。"], note:""},
    {n:"许浑", b:791, d:858, approx:true, seal:"丁卯", year:"年份不详", head:"",
     paras:[], poem:["一上高城万里愁，蒹葭杨柳似汀洲。","溪云初起日沉阁，山雨欲来风满楼。","鸟下绿芜秦苑夕，蝉鸣黄叶汉宫秋。","行人莫问当年事，故国东来渭水流。"], note:""},
    {n:"罗隐", b:833, d:909, seal:"昭谏", year:"年份不详", head:"",
     paras:[], poem:["不论平地与山尖，无限风光尽被占。","采得百花成蜜后，为谁辛苦为谁甜。"], note:""},
    {n:"韦庄", b:836, d:910, seal:"端己", year:"年份不详", head:"",
     paras:[], poem:["江雨霏霏江草齐，六朝如梦鸟空啼。","无情最是台城柳，依旧烟笼十里堤。"], note:""},
    {n:"冯延巳", b:903, d:960, seal:"正中", year:"年份不详", head:"",
     paras:[], poem:["谁道闲情抛掷久，每到春来，惆怅还依旧。","日日花前常病酒，不辞镜里朱颜瘦。","河畔青芜堤上柳，为问新愁，何事年年有。","独立小桥风满袖，平林新月人归后。"], note:""},
    {n:"林逋", b:967, d:1028, seal:"君复", year:"年份不详", head:"",
     paras:[], poem:["众芳摇落独暄妍，占尽风情向小园。","疏影横斜水清浅，暗香浮动月黄昏。","霜禽欲下先偷眼，粉蝶如知合断魂。","幸有微吟可相狎，不须檀板共金尊。"], note:""},
    {n:"范仲淹", b:989, d:1052, seal:"希文", year:"年份不详", head:"",
     paras:[], poem:["塞下秋来风景异，衡阳雁去无留意。","四面边声连角起，千嶂里，长烟落日孤城闭。","浊酒一杯家万里，燕然未勒归无计。","羌管悠悠霜满地，人不寐，将军白发征夫泪。"], note:""},
    {n:"张先", b:990, d:1078, seal:"子野", year:"年份不详", head:"",
     paras:[], poem:["水调数声持酒听，午醉醒来愁未醒。","送春春去几时回？临晚镜，伤流景，往事后期空记省。","沙上并禽池上暝，云破月来花弄影。","重重帘幕密遮灯，风不定，人初静，明日落红应满径。"], note:""},
    {n:"晏几道", b:1038, d:1110, seal:"叔原", year:"年份不详", head:"",
     paras:[], poem:["梦后楼台高锁，酒醒帘幕低垂。","去年春恨却来时，落花人独立，微雨燕双飞。","记得小蘋初见，两重心字罗衣。","琵琶弦上说相思，当时明月在，曾照彩云归。"], note:""},
    {n:"贺铸", b:1052, d:1125, seal:"方回", year:"年份不详", head:"",
     paras:[], poem:["凌波不过横塘路，但目送、芳尘去。","锦瑟华年谁与度？月桥花院，琐窗朱户，只有春知处。","飞云冉冉蘅皋暮，彩笔新题断肠句。","试问闲情都几许？一川烟草，满城风絮，梅子黄时雨。"], note:""},
    {n:"周邦彦", b:1056, d:1121, seal:"美成", year:"年份不详", head:"",
     paras:[], poem:["燎沉香，消溽暑。鸟雀呼晴，侵晓窥檐语。","叶上初阳干宿雨，水面清圆，一一风荷举。","故乡遥，何日去？家住吴门，久作长安旅。","五月渔郎相忆否？小楫轻舟，梦入芙蓉浦。"], note:""},
    {n:"朱敦儒", b:1081, d:1159, seal:"希真", year:"年份不详", head:"",
     paras:[], poem:["金陵城上西楼，倚清秋。","万里夕阳垂地大江流。","中原乱，簪缨散，几时收？","试倩悲风吹泪过扬州。"], note:""},
    {n:"陈与义", b:1090, d:1138, seal:"去非", year:"年份不详", head:"",
     paras:[], poem:["庙堂无策可平戎，坐使甘泉照夕烽。","初怪上都闻战马，岂知穷海看飞龙。","孤臣霜发三千丈，每岁烟花一万重。","稍喜长沙向延阁，疲兵敢犯犬羊锋。"], note:""},
    {n:"岳飞", b:1103, d:1142, seal:"鹏举", year:"年份不详", head:"",
     paras:[], poem:["怒发冲冠，凭栏处、潇潇雨歇。","抬望眼，仰天长啸，壮怀激烈。","三十功名尘与土，八千里路云和月。","莫等闲、白了少年头，空悲切。","靖康耻，犹未雪。臣子恨，何时灭！","驾长车，踏破贺兰山缺。","壮志饥餐胡虏肉，笑谈渴饮匈奴血。","待从头、收拾旧山河，朝天阙。"], note:""},
    {n:"朱熹", b:1130, d:1200, seal:"元晦", year:"年份不详", head:"",
     paras:[], poem:["半亩方塘一鉴开，天光云影共徘徊。","问渠那得清如许？为有源头活水来。"], note:""},
    {n:"张孝祥", b:1132, d:1170, seal:"安国", year:"年份不详", head:"",
     paras:[], poem:["洞庭青草，近中秋，更无一点风色。","玉鉴琼田三万顷，着我扁舟一叶。","素月分辉，明河共影，表里俱澄澈。","悠然心会，妙处难与君说。","应念岭海经年，孤光自照，肝肺皆冰雪。","短发萧骚襟袖冷，稳泛沧浪空阔。","尽挹西江，细斟北斗，万象为宾客。","扣舷独啸，不知今夕何夕！"], note:""},
    {n:"刘过", b:1154, d:1206, seal:"改之", year:"年份不详", head:"",
     paras:[], poem:["芦叶满汀洲，寒沙带浅流。","二十年重过南楼。","柳下系船犹未稳，能几日，又中秋。","黄鹤断矶头，故人今在否？","旧江山浑是新愁。","欲买桂花同载酒，终不似，少年游。"], note:""},
    {n:"刘克庄", b:1187, d:1269, seal:"潜夫", year:"年份不详", head:"",
     paras:[], poem:["一片能教一断肠，可堪平砌更堆墙。","飘如迁客来过岭，坠似骚人去赴湘。","乱点莓苔多莫数，偶粘衣袖久犹香。","东风谬掌花权柄，却忌孤高不主张。"], note:""},
    {n:"元好问", b:1190, d:1257, seal:"裕之", year:"年份不详", head:"",
     paras:[], poem:["问世间，情是何物，直教生死相许？","天南地北双飞客，老翅几回寒暑。","欢乐趣，离别苦，就中更有痴儿女。","君应有语：渺万里层云，千山暮雪，只影向谁去？","横汾路，寂寞当年箫鼓，荒烟依旧平楚。","招魂楚些何嗟及，山鬼暗啼风雨。","天也妒，未信与，莺儿燕子俱黄土。","千秋万古，为留待骚人，狂歌痛饮，来访雁丘处。"], note:""},
    {n:"吴文英", b:1200, d:1260, approx:true, seal:"君特", year:"年份不详", head:"",
     paras:[], poem:["听风听雨过清明，愁草瘗花铭。","楼前绿暗分携路，一丝柳、一寸柔情。","料峭春寒中酒，交加晓梦啼莺。","西园日日扫林亭，依旧赏新晴。","黄蜂频扑秋千索，有当时、纤手香凝。","惆怅双鸳不到，幽阶一夜苔生。"], note:""},
    {n:"文天祥", b:1236, d:1283, seal:"宋瑞", year:"祥兴二年 1279", head:"",
     paras:[], poem:["辛苦遭逢起一经，干戈寥落四周星。","山河破碎风飘絮，身世浮沉雨打萍。","惶恐滩头说惶恐，零丁洋里叹零丁。","人生自古谁无死？留取丹心照汗青。"], note:""},
    {n:"蒋捷", b:1245, d:1305, approx:true, seal:"胜欲", year:"年份不详", head:"",
     paras:[], poem:["少年听雨歌楼上，红烛昏罗帐。","壮年听雨客舟中，江阔云低、断雁叫西风。","而今听雨僧庐下，鬓已星星也。","悲欢离合总无情，一任阶前、点滴到天明。"], note:""},
    {n:"马致远", b:1250, d:1321, approx:true, seal:"千里", year:"年份不详", head:"",
     paras:[], poem:["枯藤老树昏鸦，小桥流水人家，","古道西风瘦马。","夕阳西下，断肠人在天涯。"], note:""},
    {n:"张养浩", b:1270, d:1329, seal:"希孟", year:"年份不详", head:"",
     paras:[], poem:["峰峦如聚，波涛如怒，山河表里潼关路。","望西都，意踌躇。","伤心秦汉经行处，宫阙万间都做了土。","兴，百姓苦；亡，百姓苦。"], note:""},
    {n:"王冕", b:1287, d:1359, seal:"元章", year:"年份不详", head:"",
     paras:[], poem:["我家洗砚池头树，个个花开淡墨痕。","不要人夸好颜色，只留清气满乾坤。"], note:"异文多，从通行本"},
    {n:"高启", b:1336, d:1374, seal:"季迪", year:"年份不详", head:"",
     paras:[], poem:["琼姿只合在瑶台，谁向江南处处栽？","雪满山中高士卧，月明林下美人来。","寒依疏影萧萧竹，春掩残香漠漠苔。","自去何郎无好咏，东风愁寂几回开。"], note:""},
    {n:"于谦", b:1398, d:1457, seal:"廷益", year:"年份不详", head:"",
     paras:[], poem:["千锤万凿出深山，烈火焚烧若等闲。","粉骨碎身浑不怕，要留清白在人间。"], note:""},
    {n:"唐寅", b:1470, d:1524, seal:"伯虎", year:"年份不详", head:"",
     paras:[], poem:["不炼金丹不坐禅，不为商贾不耕田。","闲来写就青山卖，不使人间造孽钱。"], note:""},
    {n:"杨慎", b:1488, d:1559, seal:"用修", year:"年份不详", head:"",
     paras:[], poem:["滚滚长江东逝水，浪花淘尽英雄。","是非成败转头空。","青山依旧在，几度夕阳红。","白发渔樵江渚上，惯看秋月春风。","一壶浊酒喜相逢。","古今多少事，都付笑谈中。"], note:""},
    {n:"纳兰性德", b:1655, d:1685, seal:"容若", year:"年份不详", head:"",
     paras:[], poem:["人生若只如初见，何事秋风悲画扇。","等闲变却故人心，却道故人心易变。","骊山语罢清宵半，泪雨霖铃终不怨。","何如薄幸锦衣郎，比翼连枝当日愿。"], note:""},
    {n:"郑燮", b:1693, d:1765, seal:"克柔", year:"年份不详", head:"",
     paras:[], poem:["咬定青山不放松，立根原在破岩中。","千磨万击还坚劲，任尔东西南北风。"], note:""},
    {n:"袁枚", b:1716, d:1797, seal:"子才", year:"年份不详", head:"",
     paras:[], poem:["白日不到处，青春恰自来。","苔花如米小，也学牡丹开。"], note:""},
    {n:"龚自珍", b:1792, d:1841, seal:"璱人", year:"道光十九年 1839", head:"",
     paras:[], poem:["浩荡离愁白日斜，吟鞭东指即天涯。","落红不是无情物，化作春泥更护花。"], note:""},
    {n:"秋瑾", b:1875, d:1907, seal:"竞雄", year:"光绪二十九年 1903", head:"",
     paras:[], poem:["小住京华，早又是，中秋佳节。","为篱下，黄花开遍，秋容如拭。","四面歌残终破楚，八年风味徒思浙。","苦将侬，强派作蛾眉，殊未屑！","身不得，男儿列。心却比，男儿烈！","算平生肝胆，因人常热。","俗子胸襟谁识我？英雄末路当磨折。","莽红尘，何处觅知音？青衫湿！"], note:""}

      {t:"望洞庭湖赠张丞相", year:"年份不详", head:"", paras:[], note:"", poem:["八月湖水平，涵虚混太清。","气蒸云梦泽，波撼岳阳城。","欲济无舟楫，端居耻圣明。","坐观垂钓者，徒有羡鱼情。"]},
      {t:"岁暮归南山", year:"年份不详", head:"", paras:[], note:"", poem:["北阙休上书，南山归敝庐。","不才明主弃，多病故人疏。","白发催年老，青阳逼岁除。","永怀愁不寐，松月夜窗虚。"]},
      {t:"早寒江上有怀", year:"年份不详", head:"", paras:[], note:"", poem:["木落雁南度，北风江上寒。","我家襄水曲，遥隔楚云端。","乡泪客中尽，孤帆天际看。","迷津欲有问，平海夕漫漫。"]}

      {t:"望庐山瀑布", year:"年份不详", head:"", paras:[], note:"", poem:["日照香炉生紫烟，遥看瀑布挂前川。","飞流直下三千尺，疑是银河落九天。"]},
      {t:"黄鹤楼送孟浩然之广陵", year:"年份不详", head:"", paras:[], note:"", poem:["故人西辞黄鹤楼，烟花三月下扬州。","孤帆远影碧空尽，唯见长江天际流。"]},
      {t:"将进酒", year:"年份不详", head:"", paras:[], note:"", poem:["君不见黄河之水天上来，奔流到海不复回。","君不见高堂明镜悲白发，朝如青丝暮成雪。","人生得意须尽欢，莫使金樽空对月。","天生我材必有用，千金散尽还复来。","烹羊宰牛且为乐，会须一饮三百杯。","岑夫子，丹丘生，将进酒，杯莫停。","与君歌一曲，请君为我倾耳听。","钟鼓馔玉不足贵，但愿长醉不愿醒。","古来圣贤皆寂寞，惟有饮者留其名。","陈王昔时宴平乐，斗酒十千恣欢谑。","主人何为言少钱，径须沽取对君酌。","五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。"]},
      {t:"行路难·其一", year:"年份不详", head:"", paras:[], note:"", poem:["金樽清酒斗十千，玉盘珍羞直万钱。","停杯投箸不能食，拔剑四顾心茫然。","欲渡黄河冰塞川，将登太行雪满山。","闲来垂钓碧溪上，忽复乘舟梦日边。","行路难，行路难，多歧路，今安在？","长风破浪会有时，直挂云帆济沧海。"]},
      {t:"赠汪伦", year:"年份不详", head:"", paras:[], note:"", poem:["李白乘舟将欲行，忽闻岸上踏歌声。","桃花潭水深千尺，不及汪伦送我情。"]},
      {t:"月下独酌·其一", year:"年份不详", head:"", paras:[], note:"", poem:["花间一壶酒，独酌无相亲。","举杯邀明月，对影成三人。","月既不解饮，影徒随我身。","暂伴月将影，行乐须及春。","我歌月徘徊，我舞影零乱。","醒时同交欢，醉后各分散。","永结无情游，相期邈云汉。"]}

      {t:"春望", year:"年份不详", head:"", paras:[], note:"", poem:["国破山河在，城春草木深。","感时花溅泪，恨别鸟惊心。","烽火连三月，家书抵万金。","白头搔更短，浑欲不胜簪。"]},
      {t:"登高", year:"年份不详", head:"", paras:[], note:"", poem:["风急天高猿啸哀，渚清沙白鸟飞回。","无边落木萧萧下，不尽长江滚滚来。","万里悲秋常作客，百年多病独登台。","艰难苦恨繁霜鬓，潦倒新停浊酒杯。"]},

      {t:"闻官军收河南河北", year:"年份不详", head:"", paras:[], note:"", poem:["剑外忽传收蓟北，初闻涕泪满衣裳。","却看妻子愁何在，漫卷诗书喜欲狂。","白日放歌须纵酒，青春作伴好还乡。","即从巴峡穿巫峡，便下襄阳向洛阳。"]},

      {t:"浪淘沙令", year:"年份不详", head:"", paras:[], note:"", poem:["帘外雨潺潺，春意阑珊。","罗衾不耐五更寒。","梦里不知身是客，一晌贪欢。","独自莫凭栏，无限江山。","别时容易见时难。","流水落花春去也，天上人间。"]},

    "柳永": [
      {t:"蝶恋花", year:"年份不详", head:"", paras:[], note:"", poem:["伫倚危楼风细细。","望极春愁，黯黯生天际。","草色烟光残照里，无言谁会凭阑意。","拟把疏狂图一醉。","对酒当歌，强乐还无味。","衣带渐宽终不悔，为伊消得人憔悴。"]},
      {t:"八声甘州", year:"年份不详", head:"", paras:[], note:"", poem:["对潇潇暮雨洒江天，一番洗清秋。","渐霜风凄紧，关河冷落，残照当楼。","是处红衰翠减，苒苒物华休。","惟有长江水，无语东流。","不忍登高临远，望故乡渺邈，归思难收。","叹年来踪迹，何事苦淹留。","想佳人妆楼颙望，误几回、天际识归舟。","争知我，倚阑干处，正恁凝愁。"]}

      {t:"破阵子·春景", year:"年份不详", head:"", paras:[], note:"", poem:["燕子来时新社，梨花落后清明。","池上碧苔三四点，叶底黄鹂一两声。","日长飞絮轻。","巧笑东邻女伴，采桑径里逢迎。","疑怪昨宵春梦好，元是今朝斗草赢。","笑从双脸生。"]}

      {t:"浪淘沙", year:"年份不详", head:"", paras:[], note:"", poem:["把酒祝东风，且共从容。","垂杨紫陌洛城东。","总是当时携手处，游遍芳丛。","聚散苦匆匆，此恨无穷。","今年花胜去年红。","可惜明年花更好，知与谁同？"]},

    "苏轼": [
      {
        t:"水调歌头", year:"熙宁九年 1076", head:"密州　中秋",
        note:"熙宁九年　丙辰中秋　欢饮达旦　大醉　作此篇",
        paras:[
          "熙宁九年，中秋。密州。",
          "密州的秋天来得早。城墙外的草，已经黄了。",
          "那年我四十岁。从杭州调过来，管一个穷州。公务不多，酒倒是常有。",
          "今晚月亮好。好得不像话。",
          "几个同僚在，家里也有酒。喝到后来，他们一个个走了，剩我，和月亮。",
          "子由在济南。我们兄弟，好几年没见了。",
          "月亮升到中天，院子里亮得像下了一层霜。",
          "我端着杯子站起来，问了一句：这月亮，是从什么时候开始有的？",
          "没有人答我。",
          "我想，天上今夜，又是什么年月。",
          "想上去看看。又怕那边太冷。",
          "站了一会儿，还是地上好——至少影子还跟着我。",
          "月亮转到屋檐后头去了。屋里那个人，睡不着。",
          "人这一辈子，聚散跟月亮的圆缺差不多，古来如此。",
          "既然这样，那就只说一句：但愿人长久。",
          "我就着月光，把这首写了下来。"
        ],
        poem:[
          "明月几时有？把酒问青天。",
          "不知天上宫阙，今夕是何年。",
          "我欲乘风归去，又恐琼楼玉宇，高处不胜寒。",
          "起舞弄清影，何似在人间。",
          "转朱阁，低绮户，照无眠。",
          "不应有恨，何事长向别时圆？",
          "人有悲欢离合，月有阴晴圆缺，此事古难全。",

      {t:"江城子·密州出猎", year:"熙宁八年 1075", head:"", paras:[], note:"", poem:["老夫聊发少年狂。","左牵黄，右擎苍。","锦帽貂裘，千骑卷平冈。","为报倾城随太守，亲射虎，看孙郎。","酒酣胸胆尚开张。","鬓微霜，又何妨！","持节云中，何日遣冯唐？","会挽雕弓如满月，西北望，射天狼。"]},
      {t:"江城子·乙卯正月二十日夜记梦", year:"熙宁八年 1075", head:"", paras:[], note:"", poem:["十年生死两茫茫。","不思量，自难忘。","千里孤坟，无处话凄凉。","纵使相逢应不识，尘满面，鬓如霜。","夜来幽梦忽还乡。","小轩窗，正梳妆。","相顾无言，惟有泪千行。","料得年年肠断处，明月夜，短松冈。"]},

      {t:"惠崇春江晚景", year:"年份不详", head:"", paras:[], note:"", poem:["竹外桃花三两枝，春江水暖鸭先知。","蒌蒿满地芦芽短，正是河豚欲上时。"]},
      {t:"念奴娇·赤壁怀古", year:"元丰五年 1082", head:"", paras:[], note:"「樯橹」一作「强虏」", poem:["大江东去，浪淘尽，千古风流人物。","故垒西边，人道是，三国周郎赤壁。","乱石穿空，惊涛拍岸，卷起千堆雪。","江山如画，一时多少豪杰。","遥想公瑾当年，小乔初嫁了，雄姿英发。","羽扇纶巾，谈笑间，樯橹灰飞烟灭。","故国神游，多情应笑我，早生华发。","人生如梦，一尊还酹江月。"]}

      var y = (1-t)*(1-t)*p0[1] + 2*(1-t)*t*c[1] + t*t*p1[1];
      var dx = 2*(1-t)*(c[0]-p0[0]) + 2*t*(p1[0]-c[0]);
      var dy = 2*(1-t)*(c[1]-p0[1]) + 2*t*(p1[1]-c[1]);
      var m = Math.sqrt(dx*dx + dy*dy) || 1;
      var nx = -dy/m, ny = dx/m;
      var w = wMax * (tailThin ? Math.pow(1-t, .7) : Math.pow(Math.sin(Math.PI*t), .55)) * .5 + .25;
      L.push([x + nx*w, y + ny*w]);
      R.push([x - nx*w, y - ny*w]);
    }
    var d = "M" + L[0][0].toFixed(1) + " " + L[0][1].toFixed(1);
    for(var i = 1; i < L.length; i++) d += " L" + L[i][0].toFixed(1) + " " + L[i][1].toFixed(1);
    for(var i = R.length - 1; i >= 0; i--) d += " L" + R[i][0].toFixed(1) + " " + R[i][1].toFixed(1);
    return d + " Z";
  }

  function build(){
    W = viewport.clientWidth;
    H = PAD_T + (Y1 - Y0) * PPY;
    world.style.height = H + "px";
    measure();

    var svg = svgEl("svg", {width: W, height: H, viewBox: "0 0 " + W + " " + H});
    var cx = Math.round(W / 2);

    /* 脊：一笔到底，略抖，像手画的 */
    var pts = [], wig = [];
    for(var i = 0; i <= 60; i++){
      var t = i / 60;
      var y = PAD_T + t * (H - PAD_T);
      var x = cx + Math.sin(t * 7.1) * 1.6 + Math.sin(t * 23.3) * .7;
      pts.push([x, y]);
    }
    var dSpine = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
    for(var i = 1; i < pts.length; i++) dSpine += " L" + pts[i][0].toFixed(1) + " " + pts[i][1].toFixed(1);
    svg.appendChild(svgEl("path", {d: dSpine, fill:"none", stroke:"rgba(46,40,32,.72)",
                                   "stroke-width": 1.8, "stroke-linecap":"round"}));
    svg.appendChild(svgEl("path", {d: dSpine, fill:"none", stroke:"rgba(46,40,32,.10)",
                                   "stroke-width": 7, "stroke-linecap":"round"}));

    /* 年齿 */
    var step = PPY >= 7 ? 5 : (PPY >= 3 ? 10 : 25);
    for(var y = Math.ceil(Y0 / 50) * 50; y <= Y1; y += step){
      if(y === 0) continue;   /* 没有公元 0 年 */
      var yy = PAD_T + (y - Y0) * PPY;
      var big = (y % 100 === 0), mid = (y % 50 === 0);
      var len = big ? 13 : (mid ? 8 : 4);
      svg.appendChild(svgEl("line", {
        x1: cx - len, y1: yy, x2: cx + len, y2: yy,
        stroke: big ? "rgba(46,40,32,.55)" : (mid ? "rgba(46,40,32,.30)" : "rgba(46,40,32,.14)"),
        "stroke-width": big ? 1.3 : 1
      }));
      if(big || (mid && PPY >= 3)){
        var t = svgEl("text", {x: cx - 19, y: yy + 4, "text-anchor":"end",
                               fill:"rgba(70,60,46,.75)", "font-size": 11,
                               "font-family":"KaiTi,STKaiti,serif"});
        t.textContent = fmtY(y);
        svg.appendChild(t);
      }
    }

    /* 肋 */
    var tagLayer = svgEl("g", {});
    order.forEach(function(p, i){
      var side = (i % 2 === 0) ? 1 : -1;
      var yb = PAD_T + (p.b - Y0) * PPY, yd = PAD_T + (p.d - Y0) * PPY;
      var maxR = Math.min(W * 0.36, 304);
      var rstep = Math.min(38, (maxR - 60) / 3);
      var reach = maxR - ((i * 5) % 4) * rstep;          /* 打乱四档，不成两列 */
      var tipx = cx + side * reach + ((i * 7) % 5 - 2) * 12;  /* 五档微偏，-24 ~ +24 */
      var has = !!p.paras;

      var tipy = yb - 78;
      var by = tipy + 20;   /* 牌顶实际位置：吊点下方固定 20px */

      var g = svgEl("g", {});
      g.style.cursor = has ? "pointer" : "default";

      /* 肋线：斜向上，从中轴到吊点 */
      g.appendChild(svgEl("path", {
        d: brush([cx, yb], [cx + side * reach * .35, yb - 36], [tipx, tipy],
                 has ? 1.8 : 1.2, 20, true),
        fill: has ? "rgba(38,32,26,.45)" : "rgba(74,64,50,.22)"
      }));

      /* 挂绳：从吊点垂到牌顶 */
      g.appendChild(svgEl("line", {
        x1: tipx, y1: tipy, x2: tipx, y2: by,
        stroke: "rgba(74,64,50,.3)", "stroke-width": .7
      }));

      /* 吊点 */
      g.appendChild(svgEl("circle", {cx: tipx, cy: tipy, r: has ? 2.6 : 1.8,
        fill: has ? "rgba(38,32,26,.9)" : "rgba(74,64,50,.5)"}));

      var label = p.n + (p.approx ? "?" : "") + (HAO[p.n] ? "　" + HAO[p.n] : "");
      var sub = p.b + "–" + p.d + "　" + (p.d - p.b) + "岁";

      if(PPY >= 2.4){
        /* 竖牌：像桃符，名竖排，号在旁，底下刻享年 */
        var age = p.d - p.b;
        var th = Math.max(50 + age, 40 + p.n.length * 17);   /* 牌高随寿命，但保证名字能放下 */
        var tw2 = 44;
        var bx = tipx - tw2 / 2;

        var tag = svgEl("g", {"class":"sway"});
        tag.style.transformOrigin = tipx + "px " + by + "px";   /* 以牌顶为轴，摆幅与 shift 无关 */
        tag.style.animationDuration = (6.4 + (i % 5) * .8).toFixed(1) + "s";
        tag.style.animationDelay = (-(i % 7) * .85).toFixed(2) + "s";

        /* 影 */
        tag.appendChild(svgEl("rect", {x: bx + 2, y: by + 3, width: tw2, height: th, rx: 4,
                                       fill: "rgba(60,42,22,.13)"}));
        /* 牌身：有故事的用宣纸色，其余用旧木色 */
        tag.appendChild(svgEl("rect", {x: bx, y: by, width: tw2, height: th, rx: 4,
                                       fill: has ? "rgba(243,236,220,.97)" : "rgba(208,192,165,.96)",
                                       stroke: has ? "rgba(72,60,42,.5)" : "rgba(88,68,42,.45)",
                                       "stroke-width": 1}));
        /* 内框，像刻出来的边 */
        tag.appendChild(svgEl("rect", {x: bx + 4, y: by + 5, width: tw2 - 8, height: th - 10, rx: 2,
                                       fill: "none",
                                       stroke: has ? "rgba(90,80,60,.30)" : "rgba(100,78,50,.28)",
                                       "stroke-width": .7}));
        /* 穿孔 */
        tag.appendChild(svgEl("circle", {cx: tipx, cy: by + 9, r: 2.6,
                                         fill: "none", stroke: "rgba(70,58,40,.6)", "stroke-width": .9}));

        /* 名：一字一行 */
        var chars = p.n.split("");
        var ny = by + 30;
        chars.forEach(function(ch){
          var t = svgEl("text", {x: tipx - 5, y: ny, "text-anchor":"middle",
                                 fill: has ? "rgba(28,40,30,.96)" : "rgba(58,42,22,.94)",
                                 "font-size": 14, "font-family":"KaiTi,STKaiti,serif"});
          t.textContent = ch;
          tag.appendChild(t);
          ny += 17;
        });

        /* 号：小字在右 */
        var hao = HAO[p.n] || "";
        var hy = by + 30;
        hao.split("").forEach(function(ch){
          var t = svgEl("text", {x: tipx + 13, y: hy, "text-anchor":"middle",
                                 fill: has ? "rgba(40,56,42,.7)" : "rgba(90,68,38,.65)",
                                 "font-size": 8, "font-family":"KaiTi,STKaiti,serif"});
          t.textContent = ch;
          tag.appendChild(t);
          hy += 10;
        });

        /* 底下刻一个数 */
        var age = svgEl("text", {x: tipx, y: by + th - 9, "text-anchor":"middle",
                                 fill: has ? "rgba(40,56,42,.6)" : "rgba(90,68,38,.6)",
                                 "font-size": 8, "font-family":"KaiTi,STKaiti,serif",
                                 "letter-spacing":".5"});
        age.textContent = (p.d - p.b) + "岁";
        tag.appendChild(age);

        tagLayer.appendChild(tag);
        if(has){
          tag.addEventListener("click", function(e){ e.stopPropagation(); openGallery(p); });
        }
      } else {
        var tx = svgEl("text", {
          x: tipx + (side > 0 ? 11 : -11), y: tipy + 4,
          "text-anchor": side > 0 ? "start" : "end",
          fill: has ? "rgba(30,26,20,.95)" : "rgba(74,64,50,.78)",
          "font-size": has ? 15 : 13.5,
          "font-family":"KaiTi,STKaiti,serif", "letter-spacing":"1"
        });
        tx.textContent = label;
        g.appendChild(tx);

        var sm = svgEl("text", {
          x: tipx + (side > 0 ? 11 : -11), y: tipy + 18,
          "text-anchor": side > 0 ? "start" : "end",
          fill: "rgba(96,82,62,.62)", "font-size": 9.5,
          "font-family":"KaiTi,STKaiti,serif", "letter-spacing":".5"
        });
        sm.textContent = sub;
        g.appendChild(sm);
      }

      if(has){
        g.addEventListener("click", function(e){ e.stopPropagation(); openGallery(p); });
      }
      svg.appendChild(g);
    });

    /* 牌子最后铺上去，压在肋之上 */
    svg.appendChild(tagLayer);

    var old = world.querySelector("svg");
    if(old) world.removeChild(old);
    world.appendChild(svg);
  }

  /* 视口与可滚距离缓存起来，别在每次手指移动时量高度（那会强制重排） */
  var viewH = 0, maxS = 0, lastRange = "";
  function measure(){
    viewH = viewport.clientHeight;
    maxS = Math.max(0, H - viewH);
  }
  function apply(){
    world.style.transform = "translateY(" + (-scroll) + "px)";
    var a = Math.max(Y0, Math.round(Y0 + (scroll - PAD_T) / PPY));
    var b = Math.round(Y0 + (scroll + viewH - PAD_T) / PPY);
    var s = fmtY(Math.min(a, Y1)) + "–" + fmtY(Math.min(b, Y1));
    if(s !== lastRange){ rangeEl.textContent = s; lastRange = s; }
  }
  function clamp(){
    if(scroll < 0) scroll = 0;
    else if(scroll > maxS) scroll = maxS;
    apply();
  }

  /* 拖动时把摆动停掉，一停下来再让它们接着晃 */
  var stillTimer = null;
  function moving(on){
    if(on){
      document.body.classList.add("moving");
      if(stillTimer){ clearTimeout(stillTimer); stillTimer = null; }
    } else {
      if(stillTimer) clearTimeout(stillTimer);
      stillTimer = setTimeout(function(){
        document.body.classList.remove("moving");
        stillTimer = null;
      }, 240);
    }
  }

  viewport.addEventListener("wheel", function(e){
    e.preventDefault();
    moving(true); scroll += e.deltaY; clamp(); moving(false);
    hintEl.style.opacity = 0;
  }, {passive:false});

  var dragY = 0, dragScroll = 0, dragging = false;
  viewport.addEventListener("mousedown", function(e){
    if(e.target.closest("g")) return;
    dragging = true; dragY = e.clientY; dragScroll = scroll;
    viewport.classList.add("drag");
    moving(true);
  });
  window.addEventListener("mousemove", function(e){
    if(!dragging) return;
    scroll = dragScroll - (e.clientY - dragY); clamp();
  });
  window.addEventListener("mouseup", function(){
    dragging = false; viewport.classList.remove("drag"); moving(false);
  });

  /* ---- 触屏：单指上下拖，带惯性 ---- */
  var tY0 = 0, tS0 = 0, lastY = 0, lastT = 0, vel = 0, glideRaf = null;
  function stopGlide(){
    if(glideRaf){ cancelAnimationFrame(glideRaf); glideRaf = null; }
  }
  function glide(){
    glideRaf = null;
    vel *= 0.95;
    if(Math.abs(vel) < 0.35){ return; }
    scroll += vel;
    clamp();
    glideRaf = requestAnimationFrame(glide);
  }
  /* 双指缩放 */
  var pinchD0 = 0, pinchP = 0, pinchCenter = 0, pinchYear = 0, pinchScale = 1;

  viewport.addEventListener("touchstart", function(e){
    hintEl.style.opacity = 0;
    stopGlide();
    moving(true);
    if(e.touches.length === 1){
      tY0 = e.touches[0].clientY; tS0 = scroll;
      lastY = tY0; lastT = Date.now(); vel = 0;
    } else if(e.touches.length === 2){
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchD0 = Math.sqrt(dx*dx + dy*dy);
      pinchP = PPY;
      var rect = viewport.getBoundingClientRect();
      pinchCenter = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
      pinchYear = Y0 + (scroll + pinchCenter - PAD_T) / PPY;
      pinchScale = 1;
      world.style.transformOrigin = "50% " + (scroll + pinchCenter) + "px";
    }
  }, {passive:true});
  viewport.addEventListener("touchmove", function(e){
    if(e.touches.length === 1){
      var y = e.touches[0].clientY;
      scroll = tS0 - (y - tY0);
      var now = Date.now(), dt = now - lastT;
      if(dt > 0){ vel = (lastY - y) / dt * 16; }   /* 像素/帧 */
      lastY = y; lastT = now;
      clamp();
      e.preventDefault();
    } else if(e.touches.length === 2){
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      var d = Math.sqrt(dx*dx + dy*dy);
      pinchScale = d / pinchD0;
      var newPPY = Math.max(MINP, Math.min(MAXP, pinchP * pinchScale));
      /* 只改 transform，不重建 */
      world.style.transform = "translateY(" + (-scroll) + "px) scaleY(" + pinchScale + ")";
      e.preventDefault();
    }
  }, {passive:false});
  viewport.addEventListener("touchend", function(e){
    if(e.touches.length === 0){
      moving(false);
      if(Math.abs(vel) > 1.5){ glideRaf = requestAnimationFrame(glide); }
    } else if(e.touches.length === 1){
      /* 双指变单指，重置滚动状态 */
      tY0 = e.touches[0].clientY; tS0 = scroll;
      lastY = tY0; lastT = Date.now(); vel = 0;
    }
  }, {passive:true});
  /* 双指完全抬起时，真正重建 */
  viewport.addEventListener("touchend", function(e){
    if(e.touches.length < 2 && pinchScale !== 1){
      var newPPY = Math.max(MINP, Math.min(MAXP, pinchP * pinchScale));
      PPY = newPPY;
      build();
      scroll = (pinchYear - Y0) * PPY + PAD_T - pinchCenter;
      clamp();
      pinchScale = 1;
      world.style.transformOrigin = "50% 0";
      world.style.transform = "translateY(" + (-scroll) + "px)";
    }
  }, {passive:true});

  window.addEventListener("resize", function(){
    var yAt = Y0 + (scroll - PAD_T) / PPY;
    build();
    scroll = (yAt - Y0) * PPY + PAD_T;
    clamp();
  });

  build();
  scroll = PAD_T + (1082 - Y0) * PPY - viewport.clientHeight / 2;
  clamp();
  setTimeout(function(){ hintEl.style.opacity = 0; }, 9000);

  /* 阅读 */
  var SPEED = 52, POEM_SPEED = 150;
  var mode = "scroll", timer = null, typingEl = null, typingStr = "", typingCb = null, cur = null, pi = 0;
  var readerEl = document.getElementById("reader");
  var headEl = document.getElementById("r-head");
  var textEl = document.getElementById("text");
  var poemEl = document.getElementById("poem");
  var tailEl = document.getElementById("tail");
  var sealEl = document.getElementById("seal2");
  var noteEl = tailEl.querySelector(".note");
  var hintEl2 = document.getElementById("hint2");

  function showHint(on){ hintEl2.classList.toggle("on", !!on); }
  function typeInto(el, str, sp, cb){
    typingEl = el; typingStr = str; typingCb = cb;
    var n = 0; el.textContent = "";
    timer = setInterval(function(){
      n++; el.textContent = str.slice(0, n);
      if(n >= str.length){
        clearInterval(timer); timer = null;
        typingEl = null; typingStr = "";
        var c = typingCb; typingCb = null;
        if(c) c();
      }
    }, sp);
  }
  function finishTyping(){
    if(timer){ clearInterval(timer); timer = null; }
    if(typingEl){
      typingEl.textContent = typingStr;
      typingEl = null; typingStr = "";
      var c = typingCb; typingCb = null;
      if(c) c();
    }
  }
  var galleryEl = document.getElementById("gallery");
  var galName = document.getElementById("gal-name");
  var slipsEl = document.getElementById("slips-inner");
  var curPerson = null;

  function cnNum(s){ return s.replace(/\d/g, function(d){ return "〇一二三四五六七八九"[d]; }); }

  function openGallery(p){
    curPerson = p;
    galName.textContent = p.n + (HAO[p.n] ? "　" + HAO[p.n] : "") + "　" + p.b + "–" + p.d;
    slipsEl.innerHTML = "";
    worksOf(p).forEach(function(w, k){
      var d = document.createElement("div");
      d.className = "slip";
      d.style.animationDuration = (6.8 + k * .9).toFixed(1) + "s";
      d.style.animationDelay = (-k * 1.3).toFixed(1) + "s";
      var line = (w.poem && w.poem[0]) ? w.poem[0] : "";
      if(line.length > 10) line = line.slice(0, 10) + "……";
      d.innerHTML = '<div class="str"></div><div class="sheet2">' +
        '<div class="t">' + (w.t || "无题") + '</div>' +
        '<div class="l">' + line + '</div>' +
        '<div class="d">' + cnNum(w.year || "") + '</div></div>';
      d.addEventListener("click", function(e){ e.stopPropagation(); openWork(w); });
      slipsEl.appendChild(d);
    });
    for(var b = 0; b < 2; b++){
      var e2 = document.createElement("div");
      e2.className = "slip blank";
      e2.style.animationDuration = (7.4 + b * .8).toFixed(1) + "s";
      e2.style.animationDelay = (-1.1 - b * 0.9).toFixed(1) + "s";
      e2.innerHTML = '<div class="str"></div><div class="sheet2"><div class="t">待 写</div></div>';
      slipsEl.appendChild(e2);
    }
    galleryEl.classList.add("on");
    mode = "gallery";
  }

  function openWork(w){
    cur = w; pi = 0;
    readerEl.classList.add("on");
    headEl.textContent = (curPerson ? curPerson.n + "　" : "") + cur.year + (cur.head ? "　·　" + cur.head : "");
    textEl.innerHTML = ""; poemEl.innerHTML = ""; poemEl.classList.remove("on");
    tailEl.classList.remove("on"); noteEl.textContent = "";
    sealEl.textContent = (curPerson && curPerson.seal) || "·";
    requestAnimationFrame(function(){ headEl.classList.add("on"); });
    showHint(false);
    mode = "story";
    setTimeout(function(){ showPara(0); }, 420);
  }
  function showPara(idx){
    if(idx >= cur.paras.length){ startPoem(); return; }
    textEl.innerHTML = "";
    var el = document.createElement("p");
    el.className = "para" + (cur.paras[idx].length <= 9 ? " short" : "");
    textEl.appendChild(el);
    requestAnimationFrame(function(){ el.classList.add("on"); });
    showHint(false);
    typeInto(el, cur.paras[idx], SPEED, function(){ if(mode === "story") showHint(true); });
  }
  function startPoem(){
    mode = "poem"; finishTyping(); textEl.innerHTML = "";
    poemEl.classList.add("on"); showHint(false);
    setTimeout(function(){ poemLine(0); }, 460);
  }
  function poemLine(k){
    if(k >= cur.poem.length){
      tailEl.classList.add("on");
      noteEl.innerHTML = (curPerson ? curPerson.n : "") + "　" + cur.note;
      mode = "done"; showHint(false); return;
    }
    var el = document.createElement("p");
    el.className = "line";
    poemEl.appendChild(el);
    typeInto(el, cur.poem[k], POEM_SPEED, function(){
      setTimeout(function(){ poemLine(k + 1); }, 660);
    });
  }
  function advance(){
    if(mode === "scroll" || mode === "done") return;
    if(timer){ finishTyping(); showHint(true); return; }
    if(mode === "poem") return;
    pi++; showPara(pi);
  }
  function backToGallery(){
    finishTyping();
    readerEl.classList.remove("on");
    headEl.classList.remove("on");
    mode = "gallery";
    showHint(false);
  }
  function backScroll(){
    finishTyping(); mode = "scroll";
    readerEl.classList.remove("on");
    galleryEl.classList.remove("on");
    headEl.classList.remove("on");
    showHint(false);
  }
  readerEl.addEventListener("click", function(e){ if(e.target.id === "back") return; advance(); });
  document.getElementById("back").addEventListener("click", function(e){ e.stopPropagation(); backToGallery(); });
  document.getElementById("gal-back").addEventListener("click", function(e){ e.stopPropagation(); backScroll(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if(mode === "story" || mode === "poem" || mode === "done") backToGallery();
      else if(mode === "gallery") backScroll();
      return;
    }
    if(e.key === " " || e.key === "Enter" || e.key === "ArrowRight"){ e.preventDefault(); advance(); }
  });

  /* 离线缓存：线上（https）才装 */
  if("serviceWorker" in navigator && location.protocol === "https:"){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }
})();
</script>
</body>
